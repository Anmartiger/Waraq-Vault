<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaraqVault</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
  <header>
    <div class="wordmark">Waraq<span class="v">Vault</span></div>
    <div class="tag">Your personal archive — Search your Arabic and English documents</div>
  </header>

  <div class="wrap">
    <div id="drop" class="uploader" role="button" tabindex="0" aria-label="Upload a document">
      <input id="file" type="file" accept="image/*,application/pdf,.pdf,.docx,.txt" hidden />
      <div class="up-icon">⬆️</div>
      <div class="up-title">Drop a file here, or click to upload</div>
      <div class="up-sub">PDF · Word (DOCX) · نص (TXT) · صورة (PNG / JPG) — تتم القراءة والفهرسة تلقائياً</div>
    </div>

    <form class="search" method="get" action="/search">
      <input type="text" name="q" value="{{Q}}" dir="auto" autofocus
             placeholder="search...  /  Search your documents…" />
      <button type="submit">search</button>
    </form>

    <div class="status" id="status">{{STATUS}}</div>

    <div id="results"></div>
  </div>

  <footer>WaraqVault <span class="dot">·</span> It operates entirely locally.<span class="dot">·</span> Fully offline</footer>

  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-title" id="modal-title">This document is already indexed</div>
      <div class="modal-text" id="modal-text"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">Cancel</button>
        <button type="button" class="btn danger" id="modal-ok">Overwrite</button>
      </div>
    </div>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
