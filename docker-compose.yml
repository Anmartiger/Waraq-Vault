services:
  gotenberg:
    image: gotenberg/gotenberg:8
    networks:
      - waraq-net
    restart: unless-stopped
    # Strict isolation: no ports exposed to host or external networks.
    # Accessible ONLY by the FastAPI container via http://gotenberg:3000

  waraq:
    build: .
    ports:
      - "8000:8000"
    networks:
      - waraq-net
    depends_on:
      - gotenberg
    environment:
      - GOTENBERG_URL=http://gotenberg:3000
    volumes:
      - ./storage:/app/storage
      - easyocr-models:/root/.EasyOCR
    # GPU passthrough (optional): uncomment the block below to pass the host
    # GPU into the container. Left off by default because Compose refuses to
    # start this service at all if the reservation can't be satisfied — it's
    # not a soft "fall back to CPU" like the app's own detection is. Needs the
    # NVIDIA Container Toolkit installed on the host first — see README.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

networks:
  waraq-net:
    driver: bridge

volumes:
  easyocr-models: