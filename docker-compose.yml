services:
  gotenberg:
    image: gotenberg/gotenberg:8
    networks:
      - waraq-net
    restart: unless-stopped
    # Strict isolation: no ports exposed to host or external networks.
    # Accessible ONLY by the FastAPI container via http://gotenberg:3000

  waraq:
    build: .
    ports:
      - "8000:8000"
    networks:
      - waraq-net
    depends_on:
      - gotenberg
    environment:
      - GOTENBERG_URL=http://gotenberg:3000
    volumes:
      - ./storage:/app/storage
      - easyocr-models:/root/.EasyOCR
    # Passes the host GPU into the container — without this, nvidia-smi and
    # torch.cuda are both invisible in here no matter what's installed on the
    # host, and engine/ocr_engine.py's own probe correctly (if unhelpfully)
    # reports "no NVIDIA card" and falls back to CPU. Requires the NVIDIA
    # Container Toolkit on the host (`nvidia-ctk`) — see README.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

networks:
  waraq-net:
    driver: bridge

volumes:
  easyocr-models: