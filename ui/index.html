<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaraqVault</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon.png">
<script>
/* Apply the saved theme before first paint to avoid a flash of the wrong mode. */
try { document.documentElement.dataset.theme = localStorage.getItem("waraq-theme") || "dark"; } catch (e) {}
</script>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <button type="button" id="nav-files" class="iconbtn only-narrow" data-i18n="nav-library|title" aria-label="Toggle library panel">☰</button>
    <div class="brand">
      <span class="wordmark">Waraq<span class="v">Vault</span></span>
      <span class="tag" data-i18n="tagline">خزانة أوراقك الخاصة — search your Arabic & English documents</span>
    </div>
    <div class="top-actions">
      <select id="device-select" class="devsel" title="Processing hardware for OCR">
        <option value="auto">⚙️ Auto</option>
        <option value="gpu">⚡ GPU</option>
        <option value="cpu">🖥 CPU</option>
      </select>
      <span id="device-chip" class="chip" hidden></span>
      <button type="button" id="lang-toggle" class="iconbtn" title="English / العربية" aria-label="Toggle language">🌐</button>
      <button type="button" id="details-toggle" class="iconbtn" title="Details panel" aria-label="Toggle details panel">🗂️</button>
      <button type="button" id="theme-toggle" class="iconbtn" title="Light / dark mode" aria-label="Toggle color theme">🌙</button>
    </div>
  </header>

  <nav class="rail" aria-label="Main">
    <div class="emblem" title="WaraqVault">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="none" stroke="currentColor" stroke-opacity=".35"/>
        <path d="M8 5.5h11.4l5 5V26a1.4 1.4 0 0 1-1.4 1.4H8A1.4 1.4 0 0 1 6.6 26V6.9A1.4 1.4 0 0 1 8 5.5z" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="16" cy="15" r="3.4" fill="currentColor"/>
        <path d="M14.6 17.2h2.8l.9 5h-4.6z" fill="currentColor"/>
      </svg>
    </div>
      <button type="button" class="railbtn" id="rail-library" data-i18n="nav-library|title">📄</button>
      <button type="button" class="railbtn" id="rail-search" data-i18n="nav-search|title">🔍</button>
      <button type="button" class="railbtn" id="rail-upload" data-i18n="nav-upload|title">⬆️</button>
      <div class="rail-spacer"></div>
      <div class="offline" data-i18n="offline|title">
        <span class="dot">●</span><span class="offline-text" data-i18n="offline"></span>
      </div>
  </nav>

  <aside class="files" id="files-panel" aria-label="File manager">
    <div class="files-head">
      <b data-i18n="library-heading">Library</b>
      <span id="files-count" class="mutecount"></span>
    </div>

    <div class="sec-title" data-i18n="sec-workspaces">Workspaces</div>
    <div id="ws-list" class="ws-list"></div>

    <div class="sec-title" data-i18n="sec-filter">Filter by type</div>
    <div class="chips" id="type-chips">
      <button type="button" class="fchip active" data-type="" data-i18n="chip-all">All</button>
      <button type="button" class="fchip" data-type="pdf" data-i18n="chip-pdf">PDF</button>
      <button type="button" class="fchip" data-type="docx" data-i18n="chip-docx">DOCX</button>
      <button type="button" class="fchip" data-type="txt" data-i18n="chip-txt">TXT</button>
      <button type="button" class="fchip" data-type="image" data-i18n="chip-img">IMG</button>
    </div>

    <input id="file-filter" class="minisearch" data-i18n="filter-placeholder|placeholder" dir="auto" autocomplete="off">

    <div id="doc-list" class="doc-list" role="listbox" aria-label="Indexed documents"></div>

    <div id="sel-bar" class="sel-bar" hidden>
      <span id="sel-count"></span>
      <button type="button" id="sel-delete" class="btn-del" data-i18n="sel-delete">Delete</button>
      <button type="button" id="sel-clear" class="btn-ghost-mini" data-i18n="sel-clear">Clear</button>
    </div>
  </aside>

  <main class="maincol">
    <div id="drop" class="uploader" role="button" tabindex="0" aria-label="Upload documents">
      <input id="file" type="file" accept="image/*,application/pdf,.pdf,.docx,.txt" multiple hidden />
      <div class="up-icon">⬆️</div>
      <div class="up-body">
        <div class="up-title" data-i18n="up-title">Drop files here, or click to upload</div>
        <div class="up-sub" data-i18n="up-sub">PDF · DOCX · TXT حتى 50 ملفاً · الصور حتى 5 — تُقرأ وتُفهرس تلقائياً</div>
      </div>
      <div class="up-opts" id="up-opts">
        <input id="workspace" class="ws-input" data-i18n="ws-placeholder|placeholder" dir="auto" autocomplete="off">
        <label class="forceocr" title="Process every PDF page and DOCX embedded image with OCR">
          <input type="checkbox" id="force-ocr" /> <span data-i18n="force-ocr-label">Force&nbsp;OCR</span>
        </label>
      </div>
    </div>

    <div id="progress" class="progress" hidden>
      <div class="progress-top">
        <span id="progress-label">Processing…</span>
        <button type="button" id="progress-cancel" class="btn-cancel" data-i18n="progress-cancel">Cancel</button>
      </div>
      <div class="progress-track"><div id="progress-bar" class="progress-fill"></div></div>
      <div id="progress-items" class="progress-items"></div>
    </div>

    <form class="search" method="get" action="/search">
      <input type="text" name="q" value="{{Q}}" dir="auto" autofocus
             data-i18n="search-placeholder|placeholder" />
      <button type="submit" data-i18n="search-button">search</button>
    </form>

    <div class="scopebar" id="scope-bar" hidden>
      <span id="scope-label"></span>
      <button type="button" id="scope-clear" title="Search all files again">✕</button>
    </div>

    <div class="status" id="status">{{STATUS}}</div>

    <div id="results"></div>
  </main>

  <aside class="details" id="details-panel" aria-label="Details">
    <div class="det-head">
      <b data-i18n="details-heading">Details</b>
      <button type="button" id="details-close" class="iconbtn" aria-label="Close details">✕</button>
    </div>
    <div id="det-body" class="det-body"></div>
  </aside>

</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-title" id="modal-title" data-i18n="modal-confirm">Confirm</div>
    <div class="modal-text" id="modal-text"></div>
    <div class="modal-choices" id="modal-choices" hidden></div>
    <div class="modal-input-row" id="modal-input-row" hidden>
      <label for="modal-input" id="modal-input-label"></label>
      <input id="modal-input" dir="ltr" autocomplete="off" spellcheck="false">
    </div>
    <div class="modal-estimate" id="modal-estimate"></div>
    <div class="modal-actions">
      <button type="button" class="btn ghost" id="modal-cancel" data-i18n="modal-cancel">Cancel</button>
      <button type="button" class="btn danger" id="modal-ok" data-i18n="modal-confirm">Confirm</button>
    </div>
  </div>
</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
