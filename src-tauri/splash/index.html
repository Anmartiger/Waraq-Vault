<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Waraq Vault</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d2e2c;
    color: #f4ead9;
    font-family: "Segoe UI", Tahoma, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .box { text-align: center; }
  .spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 18px;
    border: 3px solid rgba(244, 234, 217, 0.25);
    border-top-color: #d8b96a;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 14px; opacity: 0.75; margin-top: 8px; }
  #error { color: #e08a6b; display: none; font-size: 13px; max-width: 420px; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div>جارٍ تشغيل WaraqVault…</div>
    <div id="status">قد يستغرق التشغيل الأول دقيقة إضافية</div>
    <div id="error"></div>
  </div>
</body>
</html>
