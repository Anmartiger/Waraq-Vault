name: Build Windows installers

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*.*.*"

env:
  # Bump periodically — check https://www.libreoffice.org/download/download/ for
  # the current stable release. Pinned (rather than "latest") so builds are
  # reproducible; TDF keeps old version directories around after new releases.
  LIBREOFFICE_VERSION: "26.2.5"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-desktop.txt

      - name: Freeze backend with PyInstaller
        run: pyinstaller --noconfirm waraq-backend.spec

      - name: Stage backend into Tauri resources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "src-tauri\backend" | Out-Null
          Copy-Item -Path "dist\waraq-backend" -Destination "src-tauri\backend\waraq-backend" -Recurse -Force

      - name: Download LibreOffice installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rel = "$env:LIBREOFFICE_VERSION/win/x86_64/LibreOffice_${env:LIBREOFFICE_VERSION}_Win_x86-64.msi"
          # download.documentfoundation.org (MirrorBrain) picks a mirror by the requester's
          # GeoIP — for GitHub-hosted runners that pick is sticky, so if it lands on a mirror
          # that hasn't synced this version yet, every retry hits the same broken mirror and
          # none of them help. Fall through a couple of direct, non-redirecting mirrors instead.
          $candidates = @(
            "https://download.documentfoundation.org/libreoffice/stable/$rel",
            "https://mirrors.dotsrc.org/tdf/libreoffice/stable/$rel",
            "https://download.nus.edu.sg/mirror/tdf/libreoffice/stable/$rel",
            "https://mirror.transip.net/tdf-libreoffice/libreoffice/stable/$rel"
          )
          $out = "$env:RUNNER_TEMP\libreoffice.msi"
          $ok = $false
          foreach ($url in $candidates) {
            Write-Host "Trying $url"
            try {
              Invoke-WebRequest -Uri $url -OutFile $out -MaximumRetryCount 2 -RetryIntervalSec 5 -TimeoutSec 120
              if ((Get-Item $out).Length -gt 100MB) { $ok = $true; break }
              Write-Host "Downloaded file is suspiciously small, treating as a miss"
            } catch {
              Write-Host "Failed: $_"
            }
          }
          if (-not $ok) { throw "Could not download LibreOffice installer from any mirror" }

      - name: Install LibreOffice silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$env:RUNNER_TEMP\libreoffice.msi`" /qn /norestart" -Wait -PassThru
          # 3010 = ERROR_SUCCESS_REBOOT_REQUIRED — the install itself succeeded, a component
          # just wants a reboot we don't need on a throwaway CI VM. Only treat other codes as fatal.
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "LibreOffice install failed with exit code $($p.ExitCode)" }

      - name: Harvest LibreOffice program files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "src-tauri\libreoffice" | Out-Null
          Copy-Item -Path "C:\Program Files\LibreOffice\*" -Destination "src-tauri\libreoffice" -Recurse -Force

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app (.msi + .exe)
        run: cargo tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: waraq-vault-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
